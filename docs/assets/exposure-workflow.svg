<svg
  xmlns="http://www.w3.org/2000/svg"
  width="720"
  height="420"
  viewBox="0 0 720 420"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">The exposure triangle: from camera settings to EV100</title>
  <desc id="desc">
    Shutter time, aperture and ISO enter a pure EV100 model. Choose two manual
    values; solve the third, snap to supported camera settings in stop distance
    and report the EV rounding difference. Presets and photo metadata can
    establish a new reference.
  </desc>
  <defs>
    <marker
      id="arrow"
      markerWidth="8"
      markerHeight="8"
      refX="6"
      refY="3"
      orient="auto"
    >
      <path d="m0 0 6 3-6 3" fill="none" stroke="#7b8fa8" stroke-width="1.2" />
    </marker>
  </defs>
  <rect width="720" height="420" rx="20" fill="#20334b" />
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="34" y="43" font-size="18" font-weight="600" fill="#fff">
      One relationship. Three creative choices.
    </text>
    <text x="34" y="68" font-size="12" fill="#bdcde0">
      Choose two manual settings. Calculate the third against a reference EV100.
    </text>
    <g fill="#304862" stroke="#6684a6">
      <rect x="34" y="99" width="200" height="65" rx="9" />
      <rect x="260" y="99" width="200" height="65" rx="9" />
      <rect x="486" y="99" width="200" height="65" rx="9" />
    </g>
    <g fill="#fff" font-size="15" text-anchor="middle">
      <text x="134" y="125">Shutter time · t</text>
      <text x="360" y="125">Aperture · N</text>
      <text x="586" y="125">Sensitivity · ISO</text>
    </g>
    <g fill="#bdcde0" font-size="12" text-anchor="middle">
      <text x="134" y="148">Motion</text>
      <text x="360" y="148">Depth of field</text>
      <text x="586" y="148">Noise trade-off</text>
    </g>
    <g fill="none" stroke="#7b8fa8" stroke-width="1.5" marker-end="url(#arrow)">
      <path d="M134 164V190H340V210" />
      <path d="M360 164V210" />
      <path d="M586 164V190H380V210" />
    </g>
    <rect x="141" y="217" width="438" height="60" rx="10" fill="#dce8ff" />
    <text
      x="360"
      y="242"
      text-anchor="middle"
      font-size="16"
      font-weight="600"
      fill="#1d3b6a"
    >
      EV100 = log₂(N² / t) − log₂(ISO / 100)
    </text>
    <text x="360" y="262" text-anchor="middle" font-size="11" fill="#43556a">
      Pure equations and inverse solver
    </text>
    <path
      d="M360 277V304"
      stroke="#7b8fa8"
      stroke-width="1.5"
      marker-end="url(#arrow)"
    />
    <g fill="#304862">
      <rect x="34" y="310" width="200" height="52" rx="8" />
      <rect x="260" y="310" width="200" height="52" rx="8" />
      <rect x="486" y="310" width="200" height="52" rx="8" />
    </g>
    <g fill="#fff" font-size="12" text-anchor="middle">
      <text x="134" y="333">Solve the automatic value</text>
      <text x="360" y="333">Snap in stop distance</text>
      <text x="586" y="333">Report the EV difference</text>
    </g>
    <g fill="#bdcde0" font-size="10" text-anchor="middle">
      <text x="134" y="350">Keep the reference fixed</text>
      <text x="360" y="350">Use supported camera settings</text>
      <text x="586" y="350">Make rounding visible</text>
    </g>
    <g stroke="#7b8fa8" marker-end="url(#arrow)">
      <path d="M234 336H253" />
      <path d="M460 336H479" />
    </g>
    <text x="360" y="395" text-anchor="middle" font-size="11" fill="#bdcde0">
      Settings are calculated. Scene brightness is not measured.
    </text>
  </g>
</svg>
